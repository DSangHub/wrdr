<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>wrdr — The new way to search</title>
<meta name="description" content="The new way to search. Words not sentences. No Sponsor Ads, Just your answer.">
<style>
  :root{--bg:#0a0a0a;--fg:#f5f5f5;--dim:#666;--line:#222;--accent:#fff;--gold:#ffd166}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{
    background:var(--bg);color:var(--fg);
    font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;
    align-items:center;justify-content:center;padding:24px;
    padding-bottom:calc(24px + env(safe-area-inset-bottom));
  }
  .wrap{width:100%;max-width:480px}
  .logo{font-size:28px;font-weight:700;letter-spacing:-.5px;margin-bottom:4px}
  .tag{color:#aaa;font-size:14px;margin-bottom:24px}
  h1{font-size:clamp(32px,8vw,48px);line-height:1.1;letter-spacing:-1.5px;margin:24px 0 12px}
  .promise{font-size:18px;color:var(--fg);margin-bottom:32px}
  .submit{background:var(--fg);color:var(--bg);border:0;border-radius:10px;padding:14px 20px;font:inherit;cursor:pointer;margin-top:16px}
  button:focus-visible{outline:2px solid var(--accent);outline-offset:4px}
  .suggestions{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}
  .suggestion{max-width:100%;background:#151515;border:1px solid #333;border-radius:999px;color:var(--fg);padding:10px 14px;font:inherit;font-size:14px;text-align:left;cursor:pointer;overflow-wrap:anywhere}
  .suggestion:hover{background:#222;border-color:#aaa}
  .suggestion-label{color:#aaa;font-size:13px;margin-top:24px}
  .answer{white-space:pre-wrap;line-height:1.6;overflow-wrap:anywhere}
  #sources{display:flex;flex-direction:column;gap:10px;overflow-wrap:anywhere}
  #sources a{color:#bcd6ff}
  .meter{color:var(--dim);font-size:12px;margin-bottom:28px}
  .meter b{color:var(--fg);font-weight:500}
  .stage{min-height:180px;display:flex;flex-direction:column;gap:16px}
  .q{font-size:20px;font-weight:500;margin-bottom:4px}
  input{
    width:100%;background:transparent;border:none;border-bottom:1px solid var(--line);
    color:var(--fg);font-size:24px;padding:12px 0;outline:none;
  }
  input::placeholder{color:var(--dim)}
  input:focus{border-color:var(--accent)}
  .options{display:flex;flex-direction:column;gap:10px;margin-top:8px}
  button.opt{
    text-align:left;background:transparent;border:1px solid var(--line);
    color:var(--fg);padding:16px;border-radius:10px;font-size:16px;
    cursor:pointer;transition:all .12s;
  }
  button.opt:hover,button.opt:active{border-color:var(--accent);background:#111;transform:translateX(2px)}
  button.paid{
    border-color:var(--gold);color:var(--gold);
    display:flex;justify-content:space-between;align-items:center;
  }
  button.paid:hover,button.paid:active{border-color:var(--gold);background:#1a1508}
  button.paid small{opacity:.7;font-size:12px}
  .hint{color:var(--dim);font-size:12px;margin-top:12px}
  .back{color:var(--dim);font-size:12px;cursor:pointer;margin-top:16px;display:inline-block}
  .back:hover{color:var(--fg)}
  .fade{animation:f .2s ease}
  .loading{color:var(--dim);font-size:12px}
  @keyframes f{from{opacity:0;transform:translateY(4px)}to{opacity:1}}
</style>
</head>
<body>
<main class="wrap">
  <div class="logo">wrdr</div>
  <h1>The new way to search.</h1>
  <p class="tag">Words not sentences.</p>
  <p class="promise">No Sponsor Ads, Just your answer.</p>
  <div class="meter" id="meter"></div>
  <div class="stage" id="stage" aria-live="polite"></div>
</main>

<script>
const SEARCH_SUGGESTIONS = ["Medicine","food","check price","city name","Movies near me","Store hours","traffic updates","road closures","credit limit increase","Taco Bell specials","a meal for $10","beauty salon near me","best Gas price"];
const stage=document.getElementById('stage');
let remaining=3;
let busy=false;
function escapeHTML(value){return String(value).replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));}
function meter(){document.getElementById('meter').textContent=remaining+' of 3 free searches remaining';}
function start(value=''){
  meter();
  stage.innerHTML=`<form id="search-form">
    <label class="q" for="inp">What do you need?</label>
    <input id="inp" placeholder="words to search" maxlength="300" enterkeyhint="search" required>
    <button class="submit" type="submit">Find my answer</button>
    <p class="hint">3 searches free. On your fourth search, buy tokens or choose $19.95/year.</p>
  </form>
  <p class="suggestion-label">Try a search — tap to fill the search bar</p>
  <div class="suggestions" role="group" aria-label="Search suggestions">
    ${SEARCH_SUGGESTIONS.map((phrase,i)=>`<button class="suggestion" type="button" data-suggestion="${i}">${escapeHTML(phrase)}</button>`).join('')}
  </div>`;
  const inp=document.getElementById('inp');inp.value=value;
  stage.querySelectorAll('[data-suggestion]').forEach(btn=>btn.addEventListener('click',()=>{inp.value=SEARCH_SUGGESTIONS[Number(btn.dataset.suggestion)];inp.focus();inp.setSelectionRange(inp.value.length,inp.value.length);}));
  document.getElementById('search-form').addEventListener('submit',event=>{event.preventDefault();search(inp.value.trim());});
}
function showUnlock(){
  meter();
  stage.innerHTML=`<div class="q">Your 3 free searches are used.</div>
    <p>Keep finding answers with tokens or a yearly plan.</p>
    <div class="options">
      <button class="opt paid" data-plan="tokens5">Buy tokens — $5</button>
      <button class="opt paid" data-plan="tokens10">Buy tokens — $10</button>
      <button class="opt paid" data-plan="yearly">Yearly plan — $19.95/year</button>
    </div>
    <p class="hint" id="payment-status" role="status">Purchases are coming soon.</p>
    <button class="opt" id="back">Back to search</button>`;
  stage.querySelectorAll('[data-plan]').forEach(btn=>btn.addEventListener('click',()=>{document.getElementById('payment-status').textContent='Checkout is not available yet. Please try again later.';}));
  document.getElementById('back').addEventListener('click',()=>start());
}
async function search(query){
  if(busy || !query)return;
  if(remaining<=0){showUnlock();return;}
  busy=true;
  stage.innerHTML='<p class="q" role="status">Finding your answer…</p>';
  try{
    const response=await fetch('/api/answer',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query})});
    const data=await response.json();
    if(response.status===402){remaining=0;showUnlock();return;}
    if(!response.ok)throw new Error(data.error || 'Search unavailable.');
    remaining=data.remaining;meter();
    const sources=(data.sources || []).filter(source=>/^https?:\/\//.test(source.url));
    stage.innerHTML=`<p class="q">${escapeHTML(query)}</p><div class="answer" id="answer"></div>
      ${sources.length?'<p class="hint">Sources</p><div id="sources"></div>':''}
      <button class="opt" id="again">Search again</button>`;
    document.getElementById('answer').textContent=data.answer;
    const links=document.getElementById('sources');
    sources.forEach(source=>{const link=document.createElement('a');link.href=source.url;link.textContent=source.title;link.target='_blank';link.rel='noopener noreferrer';links.appendChild(link);});
    document.getElementById('again').addEventListener('click',()=>start());
  }catch(error){
    stage.innerHTML='<p class="q" id="error" role="alert"></p><button class="opt" id="retry">Try again</button>';
    document.getElementById('error').textContent=error.message;
    document.getElementById('retry').addEventListener('click',()=>start(query));
  }finally{busy=false;}
}
async function boot(){
  start();
  try{const response=await fetch('/api/answer');if(response.ok){const data=await response.json();remaining=data.remaining;meter();}}catch{}
}
boot();
</script>
</body>
</html>
