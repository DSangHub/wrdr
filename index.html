<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>wrdr — you are a person of few words</title>
<style>
  :root{--bg:#0a0a0a;--fg:#f5f5f5;--dim:#666;--line:#222;--accent:#fff}
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:var(--bg);color:var(--fg);
    font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    min-height:100vh;display:flex;flex-direction:column;
    align-items:center;justify-content:center;padding:24px;
  }
  .wrap{width:100%;max-width:480px}
  .logo{font-size:28px;font-weight:700;letter-spacing:-.5px;margin-bottom:4px}
  .tag{color:var(--dim);font-size:13px;margin-bottom:40px}
  .stage{min-height:180px;display:flex;flex-direction:column;gap:16px}
  .q{font-size:20px;font-weight:500;margin-bottom:4px}
  input{
    width:100%;background:transparent;border:none;border-bottom:1px solid var(--line);
    color:var(--fg);font-size:24px;padding:12px 0;outline:none;
  }
  input::placeholder{color:var(--dim)}
  input:focus{border-color:var(--accent)}
  .options{display:flex;flex-direction:column;gap:10px;margin-top:8px}
  button.opt{
    text-align:left;background:transparent;border:1px solid var(--line);
    color:var(--fg);padding:16px;border-radius:10px;font-size:16px;
    cursor:pointer;transition:all .12s;
  }
  button.opt:hover{border-color:var(--accent);background:#111;transform:translateX(2px)}
  .hint{color:var(--dim);font-size:12px;margin-top:12px}
  .back{color:var(--dim);font-size:12px;cursor:pointer;margin-top:16px;display:inline-block}
  .back:hover{color:var(--fg)}
  .fade{animation:f .2s ease}
  @keyframes f{from{opacity:0;transform:translateY(4px)}to{opacity:1}}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">wrdr</div>
  <div class="tag">few words. fast answers.</div>
  <div class="stage" id="stage"></div>
</div>

<script>
// ============ PRELOADED ROUTE TABLE ============
// word3 → [3 FAQs] → destination
const ROUTES = {
  job: [
    {label:"Find a job",      url:"https://www.indeed.com"},
    {label:"Write a resume",  url:"https://www.resumemaker.online"},
    {label:"Prep for interview", url:"https://www.glassdoor.com/Interview"}
  ],
  pain: [
    {label:"Physical pain",   url:"https://www.webmd.com/pain-management"},
    {label:"Emotional pain",  url:"https://www.psychologytoday.com"},
    {label:"Find a doctor",   url:"https://www.zocdoc.com"}
  ],
  cash: [
    {label:"Send money",      url:"https://cash.app"},
    {label:"Borrow money",    url:"https://www.lendingtree.com"},
    {label:"Earn money",      url:"https://www.upwork.com"}
  ]
};

// word2 → clarifying question that leads to a word3 key
const QUESTIONS = {
  job:  "What about work?",
  pain: "What kind?",
  cash: "What for?"
};

// map word2 → word3 key (here they're the same, but you can remap)
const WORD2_TO_KEY = { job:"job", pain:"pain", cash:"cash", work:"job", money:"cash" };

// ============ STATE ============
let state = { word1:null, word2:null, key:null };

// ============ RENDER HELPERS ============
const stage = document.getElementById('stage');

function render(html){ stage.innerHTML = html; stage.className='stage fade'; }

function showInput({question, placeholder, onEnter}){
  render(`
    <div class="q">${question}</div>
    <input id="inp" autofocus placeholder="${placeholder}" autocomplete="off" autocapitalize="off" spellcheck="false">
    <div class="hint">press enter</div>
  `);
  const inp = document.getElementById('inp');
  inp.addEventListener('keydown', e=>{
    if(e.key==='Enter' && inp.value.trim()){
      onEnter(inp.value.trim().toLowerCase());
    }
  });
}

// ============ FLOW ============
function start(){
  state = { word1:null, word2:null, key:null };
  showInput({
    question:"What do you need?",
    placeholder:"one word",
    onEnter: word1 => {
      state.word1 = word1;
      askSecond();
    }
  });
}

function askSecond(){
  // in a real build, this question would come from the AI
  // for the prototype we use a generic disambiguator
  showInput({
    question:"What kind?",
    placeholder:"one word",
    onEnter: word2 => {
      state.word2 = word2;
      route();
    }
  });
}

function route(){
  const key = WORD2_TO_KEY[state.word2] || state.word2;
  state.key = key;

  if(ROUTES[key]){
    showOptions(key);
  } else {
    // no preloaded route → offer a fallback click, still one click
    render(`
      <div class="q">No match for "${state.word2}".</div>
      <div class="options">
        <button class="opt" onclick="start()">Try again</button>
      </div>
      <span class="back" onclick="start()">← restart</span>
    `);
  }
}

function showOptions(key){
  const opts = ROUTES[key];
  const label = QUESTIONS[key] || "Pick one:";
  render(`
    <div class="q">${label}</div>
    <div class="options">
      ${opts.map(o=>`<button class="opt" data-url="${o.url}">${o.label}</button>`).join('')}
    </div>
    <span class="back" onclick="start()">← restart</span>
  `);
  // ONE CLICK → navigate
  stage.querySelectorAll('button.opt').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      window.location.href = btn.dataset.url;
    });
  });
}

// boot
start();
</script>
</body>
</html>
